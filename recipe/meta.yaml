{% set name = "opentelemetry-instrumentation-mcp" %}
{% set version = "0.62.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 109c8ef1b5340725e93ed61f21a1a1298bffce77b22dfb5861db36044678d11f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
    - opentelemetry-semantic-conventions >=0.63b1
  run_constrained:
    - mcp >=1.26.0,<2

# Tests not compatible with fastmcp version >3.0.0 (only exist in the main)
test:
  imports:
    - opentelemetry.instrumentation.mcp
  commands:
    - pip check
  requires:
    - pip
    - mcp >=1.3.0,<2.0.0

about:
  home: https://www.traceloop.com/openllmetry
  summary: OpenTelemetry mcp instrumentation
  dev_url: https://github.com/traceloop/openllmetry
  doc_url: https://www.traceloop.com/docs/openllmetry/introduction
  description: This library allows tracing of agentic workflows implemented with MCP framework mcp python sdk.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dillonroach
    - timkpaine
  skip-lints:
    - invalid_url
